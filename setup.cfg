[nosetests]
verbosity=1
with-coverage=1
cover-package=service
cover-erase=1
cover-min-percentage=95

[coverage:report]
show_missing = True
exclude_lines =
    pragma: no cover
    except Exception as error:

[flake8]
max-line-length = 100
per-file-ignores =
    */__init__.py: F401 E402

[pylint.'MESSAGES CONTROL']
disable=E1101
