name: CI Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: accounts
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URI: postgresql://postgres:postgres@localhost:5432/accounts
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Lint with Flake8
        run: flake8 service tests run_tests.py
      - name: Run nosetests and check 95 percent coverage
        run: python run_tests.py -v
  container:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t accounts:1 .
      - name: Inspect image and smoke test
        run: |
          docker images accounts --no-trunc
          docker run -d --name accounts-demo -p 8080:8080 -e DATABASE_URI=sqlite:///:memory: accounts:1
          for attempt in $(seq 1 30); do
            if curl --fail http://localhost:8080/health; then break; fi
            sleep 1
          done
          curl --fail --include http://localhost:8080/
          docker logs accounts-demo
      - name: Clean up demo container
        if: always()
        run: docker rm -f accounts-demo || true
